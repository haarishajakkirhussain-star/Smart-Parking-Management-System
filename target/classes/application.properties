# =======================================================
# ParkSmart - Smart Parking Management System Configuration
# =======================================================
server.port=8080

# -------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/parksmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Set your MySQL root password here (defaults to empty or root, can be overridden via environment variable)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------
# Data Initialization
# -------------------------------------------------------
# defer-datasource-initialization allows Hibernate to create schema first before data.sql runs
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# -------------------------------------------------------
# Web and JSON Configuration
# -------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.parksmart=INFO
logging.level.org.springframework.web=INFO
